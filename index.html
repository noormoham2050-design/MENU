<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MENU Restaurant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ef;color:#211d18;font-family:Tahoma,Arial}
header{background:#171512;color:#dfc18e;padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font: bold 30px Georgia;letter-spacing:4px}
button{cursor:pointer;border:0;padding:12px;border-radius:7px}
.gold{background:#b88a4a;color:#171512;font-weight:bold}
.hero{padding:85px 25px;color:white;background:linear-gradient(#17151299,#171512bb),url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1200') center/cover}
.hero h1{font:55px Georgia;color:#dfc18e}
.hero p{line-height:2}
h2{text-align:center;font:34px Georgia;margin-top:45px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding:25px;max-width:1100px;margin:auto}
.item{background:white;border:1px solid #e9e1d5;border-radius:12px;overflow:hidden}
.item img{width:100%;height:180px;object-fit:cover}
.info{padding:15px}
.price{color:#b88a4a;font-weight:bold}
.add{width:100%;background:#171512;color:white;margin-top:10px}
.add:hover{background:#b88a4a;color:#171512}
footer{background:#171512;color:#dfc18e;text-align:center;padding:30px}
.cart{position:fixed;bottom:18px;left:18px;background:#b88a4a;color:#171512;font-weight:bold}
#panel{display:none;position:fixed;inset:0;background:#0009;overflow:auto;padding:15px}
.box{background:white;padding:22px;border-radius:12px;max-width:500px;margin:30px auto}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:6px}
.close{float:left;background:#eee}
.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<header>
<div class="logo">MENU.</div>
<button class="gold" onclick="showCart()">🛒 السلة (<span id="count">0</span>)</button>
</header>

<section class="hero">
<small> A TASTE OF ELEGANCE </small>
<h1>لحظات تُذاق</h1>
